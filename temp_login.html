<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=http://127.0.0.1:8000/">
    <title>正在登录...</title>
    <script>
        // 设置认证 Cookie
        document.cookie = "webui_auth=e779b1ea2cd3df69a15cfd9885d001feb07641291aeed5d7e38d26a6a83bc262; path=/; max-age=86400; samesite=lax";
        
        // 跳转到主页
        window.location.href = "http://127.0.0.1:8000/";
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px;
        }
        p {
            font-size: 14px;
            opacity: 0.8;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>正在自动登录...</h1>
        <p>如果页面没有自动跳转，请<a href="http://127.0.0.1:8000/" style="color: white;">点击这里</a></p>
    </div>
</body>
</html>
